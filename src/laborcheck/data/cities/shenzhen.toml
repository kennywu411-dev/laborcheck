notes = [
  "养老保险基数按广东省标准执行，医疗和生育保险基数由深圳市医保局另行公布，两者上下限不同。",
  "失业保险、工伤保险的2026年缴费基数和失业保险2026年费率未找到官方文件，引擎暂不计算这两项（待核实）。",
  "医疗保险按一档计算（单位6%、个人2%）。",
  "公积金缴存基数上限官方只给出规则（2025年全市在岗职工月平均工资的3倍），未公布取整数；引擎按193881÷12×3=48470.25元计算（推算值）。",
  "公积金缴存基数下限：2026年9月1日起新参加工作及新调入职工为2700元，其他职工为2520元；引擎按新参加工作职工的2700元。",
  "经济补偿三倍封顶所用平均工资口径未找到官方规定，暂不提供（待核实）。",
  "最低工资是否包含个人缴纳的社保公积金，广东省和深圳市官方文件未明确（待核实）。",
  "竞业限制：深圳经济特区企业技术秘密保护条例第二十四条规定补偿按月不得少于离职前最后十二个月月平均工资的二分之一，未约定的按二分之一计算。",
]

